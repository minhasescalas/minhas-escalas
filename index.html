<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minhas Escalas — V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1080px;margin:auto;padding:22px 15px 60px}.hero{background:linear-gradient(135deg,#102a43,#176b87);color:#fff;border-radius:24px;padding:28px;box-shadow:0 14px 36px #102a4326}.hero h1{margin:0 0 7px;font-size:31px}.hero p{margin:0;opacity:.92}.search{margin-top:19px;background:#fff;padding:10px;border-radius:16px;display:flex;gap:9px;box-shadow:0 9px 28px #102a431c}.search input{flex:1;border:1px solid #d6dde7;border-radius:12px;padding:14px;font-size:17px;outline:none}.search input:focus{border-color:#176b87;box-shadow:0 0 0 3px #176b8714}.search button{border:0;border-radius:12px;padding:0 22px;background:#176b87;color:#fff;font-weight:800;cursor:pointer}.search button:disabled{opacity:.55}.notice{margin-top:12px;font-size:12px;opacity:.82}.status{margin:18px 0}.card{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:20px;margin-top:15px;box-shadow:0 6px 20px #1720330a}.profile{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.item{background:#f7f9fc;border-radius:12px;padding:12px}.item small{display:block;color:#697586;font-size:11px;margin-bottom:4px}.item b{font-size:14px}.scale{border-left:4px solid #176b87}.scale h3{margin:0 0 7px}.muted{color:#657387}.line{margin:10px 0}.tag{display:inline-block;background:#e8f3f7;color:#15566d;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;margin:2px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7ebf0;white-space:nowrap}th{font-size:11px;color:#667085;background:#fafbfd}.empty{text-align:center;padding:30px;color:#667085}.error{background:#fff2f2;border:1px solid #ffd0d0;color:#9d2020;padding:14px;border-radius:12px}.success{background:#effaf4;border:1px solid #ccebd8;color:#166534;padding:13px;border-radius:12px}.loading{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;border-radius:50%;background:#176b87;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25;transform:scale(.65)}}a{color:#176b87;font-weight:700;text-decoration:none}a:hover{text-decoration:underline}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn2{border:1px solid #d6dde7;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700;color:#344054}.footer{margin-top:18px;font-size:12px;color:#778398;text-align:center}@media(max-width:760px){.profile{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{height:48px}.hero h1{font-size:26px}.card{padding:16px}}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>👮 Minhas Escalas</h1><p>Consulte sua matrícula diretamente nos documentos públicos do processo de escalas.</p>
<div class="search"><input id="matricula" placeholder="Digite a matrícula — ex.: 113260-1" autocomplete="off"><button id="btn">Consultar</button></div>
<div class="notice">Aceita matrícula com ou sem hífen. A consulta pesquisa os documentos acessíveis do processo SEI.</div></section>
<div id="status"></div><section id="resultado"></section><div class="footer">Fonte: processo público do SEI/PMPE · versão 4</div>
</main>
<script>
const $=id=>document.getElementById(id), input=$('matricula'),btn=$('btn'),status=$('status'),out=$('resultado');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const val=x=>x||'—';
async function consultar(){const m=input.value.trim();if(!m){status.innerHTML='<div class="error">Digite uma matrícula.</div>';return}btn.disabled=true;status.innerHTML='<div class="loading"><span class="dot"></span> Consultando o processo e pesquisando os documentos…</div>';out.innerHTML='';try{const r=await fetch('/api/consultar?matricula='+encodeURIComponent(m));const d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Erro na consulta.');render(d)}catch(e){status.innerHTML='<div class="error">'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
function render(d){status.innerHTML='<div class="success"><b>Consulta concluída.</b> '+d.documentos_com_ocorrencia+' documento(s) encontrado(s) com a matrícula, entre '+d.documentos_acessiveis+' documento(s) acessíveis.</div>';if(!d.resultados.length){out.innerHTML='<div class="card empty"><b>Nenhuma ocorrência encontrada.</b><br><span class="small">A matrícula não apareceu nos documentos acessíveis nesta consulta.</span></div>';return}
const p=d.perfil||{};let h='<div class="card"><h2 style="margin-top:0">👮 Matrícula '+esc(d.matricula)+'</h2><div class="profile">';[['Nome',p.nome],['Graduação',p.graduacao],['Função',p.funcao],['Serviço',p.servico],['Viatura',p.viatura],['Equipe',p.equipe],['Horário',p.horario],['Jornada',p.jornada]].forEach(([a,b])=>h+='<div class="item"><small>'+a+'</small><b>'+esc(val(b))+'</b></div>');h+='</div></div>';
let rows=[];d.resultados.forEach((r,i)=>{h+='<div class="card scale"><h3>'+((i+1)+'. '+esc(r.titulo))+'</h3><div class="small muted">Documento <b>'+esc(r.id||'—')+'</b> · protocolo '+esc(r.data_protocolo||'—')+' · <a href="'+esc(r.url)+'" target="_blank" rel="noopener">Abrir no SEI ↗</a></div>';r.ocorrencias.forEach(o=>{h+='<div class="line"><div><b>Ocorrência localizada</b></div><div class="muted small">'+esc(o.contexto)+'</div>';if(o.data||o.servico||o.equipe||o.horario)h+='<div class="actions">'+(o.data?'<span class="tag">Data: '+esc(o.data)+'</span>':'')+(o.servico?'<span class="tag">Serviço: '+esc(o.servico)+'</span>':'')+(o.equipe?'<span class="tag">Equipe: '+esc(o.equipe)+'</span>':'')+(o.horario?'<span class="tag">Horário: '+esc(o.horario)+'</span>':'')+'</div>';h+='</div>';rows.push([o.data||r.documento_data||r.data_protocolo||'',r.id||'',o.servico||r.titulo||'',o.horario||'',o.observacao||'Encontrada'])});h+='</div>'});
h+='<div class="card"><h2 style="margin-top:0">Resumo completo</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>Registro</th><th>Serviço</th><th>Horário</th><th>Situação</th></tr></thead><tbody>';rows.forEach(x=>h+='<tr>'+x.map(v=>'<td>'+esc(val(v))+'</td>').join('')+'</tr>');h+='</tbody></table></div></div><div class="footer">Consulta realizada em '+esc(d.atualizado_em)+' · <a href="'+esc(d.fonte)+'" target="_blank" rel="noopener">Abrir processo no SEI ↗</a></div>';out.innerHTML=h}
btn.addEventListener('click',consultar);input.addEventListener('keydown',e=>{if(e.key==='Enter')consultar()});
</script></body></html>
